# gh, not tauri-apps/tauri-action: the project build is scripts/build.mjs, which
# compiles the aam and aam-service sidecars and then runs `tauri build`.
# tauri-action always invokes `tauri build` itself, so it would skip that sidecar
# step or build twice. It also does not write SHA256SUMS, which install.sh requires.
# This workflow builds once and stages a draft with the DMG, updater archive,
# signature, latest.json, and SHA256SUMS. It never publishes automatically.
# An Admin publishes the unchanged draft only after the release-policy checks.
#
# Tag push only. There is no pull_request or pull_request_target trigger, so a
# fork PR cannot read secrets. Jobs also refuse every repository except
# lapalai/ojak, so a fork's own tag push does not run this file's signing steps.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 두 OS 산출물은 draft job에서 모은다. 실기기 검증 전에는 latest에 공개하지 않는다.
  build:
    if: github.repository == 'lapalai/ojak' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15
            platform: darwin-aarch64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # 서명 비밀키를 쓰는 단계보다 먼저 막는다. 이 파일도 태그가 가리키는 커밋의 것이므로
      # 이 검사만으로는 충분하지 않다. 태그 규칙(v*, Admin만 생성)과 함께 쓴다. docs/release-policy.md 참고.
      - name: Require an annotated tag on main
        env:
          EXPECTED_REPOSITORY: lapalai/ojak
        run: |
          set -eu
          [ "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY" ] || { echo "Refusing repository $GITHUB_REPOSITORY."; exit 1; }
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          # actions/checkout가 태그를 가벼운 태그로 바꿔 둘 수 있어 원본 태그 객체를 다시 받는다.
          git fetch --no-tags --force origin "+${tag_ref}:${tag_ref}" "+refs/heads/main:refs/remotes/origin/main"
          [ "$(git cat-file -t "$tag_ref")" = "tag" ] || { echo "Tag ${GITHUB_REF_NAME} is not annotated."; exit 1; }
          [ "$(git rev-parse "${tag_ref}^{commit}")" = "$GITHUB_SHA" ] || { echo "Tag does not point at the pushed commit."; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || { echo "Tagged commit is not on main."; exit 1; }

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install npm dependencies
        run: npm ci

      - name: Require a real updater pubkey and a matching tag
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";
          const conf = JSON.parse(readFileSync("apps/desktop/src-tauri/tauri.conf.json", "utf8"));
          const cargo = readFileSync("Cargo.toml", "utf8");
          const rootPkg = JSON.parse(readFileSync("package.json", "utf8"));
          const desktopPkg = JSON.parse(readFileSync("apps/desktop/package.json", "utf8"));
          const version = conf.version;
          const tag = process.env.GITHUB_REF_NAME ?? "";
          const pubkey = conf.plugins?.updater?.pubkey ?? "";
          const cargoVersion = cargo.match(/\[workspace\.package\][\s\S]*?^version = "([^"]+)"/m)?.[1];
          if (!tag.startsWith("v") || tag.slice(1) !== version) {
            console.error(`tag ${tag} does not match tauri.conf.json version ${version}`);
            process.exit(1);
          }
          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            console.error(`refusing non x.y.z version ${version}`);
            process.exit(1);
          }
          if (cargoVersion !== version || rootPkg.version !== version || desktopPkg.version !== version) {
            console.error(`version drift: tauri=${version} cargo=${cargoVersion} root=${rootPkg.version} desktop=${desktopPkg.version}`);
            process.exit(1);
          }
          if (!pubkey || pubkey === "REPLACE_WITH_TAURI_UPDATER_PUBKEY" || pubkey.includes("REPLACE_WITH")) {
            console.error("Replace plugins.updater.pubkey with the output of `npx tauri signer generate` before tagging a release. See README.");
            process.exit(1);
          }
          const endpoint = conf.plugins?.updater?.endpoints?.[0] ?? "";
          if (!endpoint.startsWith("https://github.com/lapalai/ojak/releases/")) {
            console.error("plugins.updater.endpoints must stay on https://github.com/lapalai/ojak/releases/. See README.");
            process.exit(1);
          }
          EOF

      # 비밀키가 비어 있지 않은지만 보지 않는다. 작은 파일을 secret으로 서명해 커밋된 pubkey로 검증한다.
      # 짝이 다르거나 암호가 틀리면 빌드 전에 멈춘다. 스크립트는 키·암호를 출력하지 않는다.
      - name: Verify signing key matches committed updater pubkey
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/verify-signing-key.mjs

      - name: Test
        run: |
          set -eu
          cargo test --workspace --exclude ai-account-manager -- --test-threads=1
          cargo build -p aam-launcher
          npm run test:desktop
          npm run typecheck
          node --test scripts/package-compatible-omp.test.mjs
          if [ "$RUNNER_OS" = "Windows" ]; then
            writer="${GITHUB_WORKSPACE}/target/debug/aam.exe"
          else
            writer="${GITHUB_WORKSPACE}/target/debug/aam"
          fi
          if [ ! -f "$writer" ]; then
            echo "omp observer writer was not built: $writer"
            exit 1
          fi
          AAM_OBSERVER_TEST_WRITER="$writer" node --test \
            integrations/omp/aam-accounts.test.mjs \
            integrations/omp/aam-observer.test.mjs

      - name: Install checksum-pinned Bun for compatible omp builds
        run: |
          set -eu
          # Pins from oven-sh/bun bun-v1.4.3/SHASUMS256.txt.
          if [ "$RUNNER_OS" = "Windows" ]; then
            asset=bun-windows-x64
            expected=0bf84e808552beea67bf1202a287a35c6c825d837b287b3f8e9dd513dba35d3d
          else
            asset=bun-darwin-aarch64
            expected=80afd4c069b46a6fa8f3ec520bebc750a7843e4a8d5b9583d29ad436c00a3403
          fi
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 120 \
            "https://github.com/oven-sh/bun/releases/download/bun-v1.4.3/${asset}.zip" \
            --output "$RUNNER_TEMP/bun.zip"
          EXPECTED_BUN_SHA256="$expected" node --input-type=module <<'EOF'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          import { join } from "node:path";
          const hash = createHash("sha256").update(readFileSync(join(process.env.RUNNER_TEMP, "bun.zip"))).digest("hex");
          if (hash !== process.env.EXPECTED_BUN_SHA256) throw new Error("Pinned Bun archive checksum mismatch");
          EOF
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command 'Expand-Archive -Path "$env:RUNNER_TEMP/bun.zip" -DestinationPath "$env:RUNNER_TEMP/bun"'
          else
            unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun"
          fi
          echo "$RUNNER_TEMP/bun/$asset" >> "$GITHUB_PATH"

      - name: Prepare pinned compatible client source
        run: node scripts/prepare-client-forks.mjs "$RUNNER_TEMP/compatible-clients"

      - name: Build and execute native compatible omp
        run: node scripts/package-compatible-omp.mjs build "$RUNNER_TEMP/compatible-clients/oh-my-pi" "$RUNNER_TEMP/ojak-${{ matrix.platform }}"

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build

      - name: Retain matching Windows service symbols
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-symbols-${{ github.ref_name }}-windows-x86_64
          path: target/symbols/
          if-no-files-found: error
          retention-days: 90

      - name: Collect artifacts
        run: |
          set -eu
          stage="${RUNNER_TEMP}/ojak-${{ matrix.platform }}"
          mkdir -p "$stage"
          if [ "${{ matrix.platform }}" = "darwin-aarch64" ]; then
            dmg=$(find target -path '*/bundle/dmg/*.dmg' -type f | head -n 1)
            archive=$(find target -path '*/bundle/macos/*.app.tar.gz' -type f | head -n 1)
            if [ -z "$dmg" ] || [ -z "$archive" ] || [ ! -f "${archive}.sig" ]; then
              echo "Missing DMG, Ojak.app.tar.gz, or signature."; exit 1
            fi
            cp "$dmg" "$stage/$(basename "$dmg")"
            cp "$archive" "$stage/Ojak.app.tar.gz"
            cp "${archive}.sig" "$stage/Ojak.app.tar.gz.sig"
          else
            # NSIS 설치 파일이 그대로 업데이트 파일이다(Tauri v2). 서명 파일은 옆에 생긴다.
            setup=$(find target -path '*/bundle/nsis/*-setup.exe' -type f | head -n 1)
            if [ -z "$setup" ] || [ ! -f "${setup}.sig" ]; then
              echo "Missing NSIS setup.exe or signature."; exit 1
            fi
            cp "$setup" "$stage/$(basename "$setup")"
            cp "${setup}.sig" "$stage/$(basename "$setup").sig"
          fi
          ls -l "$stage"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ojak-${{ matrix.platform }}
          path: ${{ runner.temp }}/ojak-${{ matrix.platform }}
          if-no-files-found: error

  draft:
    needs: build
    if: github.repository == 'lapalai/ojak' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an annotated tag on main
        env:
          EXPECTED_REPOSITORY: lapalai/ojak
        run: |
          set -eu
          [ "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY" ] || { echo "Refusing repository $GITHUB_REPOSITORY."; exit 1; }
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          git fetch --no-tags --force origin "+${tag_ref}:${tag_ref}" "+refs/heads/main:refs/remotes/origin/main"
          [ "$(git cat-file -t "$tag_ref")" = "tag" ] || { echo "Tag ${GITHUB_REF_NAME} is not annotated."; exit 1; }
          [ "$(git rev-parse "${tag_ref}^{commit}")" = "$GITHUB_SHA" ] || { echo "Tag does not point at the pushed commit."; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || { echo "Tagged commit is not on main."; exit 1; }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ojak-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Generate same-release omp compatibility manifest
        run: node scripts/package-compatible-omp.mjs manifest "$RUNNER_TEMP/dist"

      - name: Stage draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "Refusing tag version that is not x.y.z."
            exit 1
          }
          stage="${RUNNER_TEMP}/dist"
          cd "$stage"
          dmg=$(ls ./*.dmg | head -n 1)
          setup=$(ls ./*-setup.exe | head -n 1)
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          notes="Ojak ${version}"
          annotated=$(git -C "$GITHUB_WORKSPACE" tag -l --format='%(contents)' "$GITHUB_REF_NAME" || true)
          if [ -n "$annotated" ]; then notes="$annotated"; fi
          VERSION="$version" NOTES="$notes" BASE="$base" SETUP="$(basename "$setup")" node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";
          const sig = (file) => readFileSync(file, "utf8").trim();
          const mac = { signature: sig("Ojak.app.tar.gz.sig"), url: `${process.env.BASE}/Ojak.app.tar.gz` };
          const win = { signature: sig(`${process.env.SETUP}.sig`), url: `${process.env.BASE}/${process.env.SETUP}` };
          const manifest = {
            version: process.env.VERSION,
            notes: process.env.NOTES,
            pub_date: new Date().toISOString(),
            platforms: {
              "darwin-aarch64": mac,
              "darwin-aarch64-app": mac,
              "windows-x86_64": win,
              "windows-x86_64-nsis": win,
            },
          };
          writeFileSync("latest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          EOF
          sha256sum "$(basename "$dmg")" Ojak.app.tar.gz Ojak.app.tar.gz.sig "$(basename "$setup")" "$(basename "$setup").sig" omp-darwin-arm64 omp-windows-x64.exe omp-compatible.json > SHA256SUMS
          test -s SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Ojak ${version}" \
            --notes "$notes" \
            "$(basename "$dmg")" Ojak.app.tar.gz Ojak.app.tar.gz.sig \
            "$(basename "$setup")" "$(basename "$setup").sig" \
            latest.json SHA256SUMS omp-darwin-arm64 omp-windows-x64.exe omp-compatible.json
