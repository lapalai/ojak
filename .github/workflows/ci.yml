name: CI

# pull_request, not pull_request_target: fork PRs run without this
# repository's secrets. This workflow does not use secrets. Do not switch it
# to pull_request_target.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple silicon, the only Mac target. windows-latest is x64.
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install npm dependencies
        run: npm ci

      - name: macOS installer scenarios
        if: runner.os == 'macOS'
        run: node --test scripts/install-sh.test.mjs

      - name: Windows installer scenarios
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File tests/install-ps1.tests.ps1

      - name: Cargo tests
        run: cargo test --workspace --exclude ai-account-manager -- --test-threads=1

      - name: Build omp observer writer
        run: cargo build -p aam-launcher

      - name: Desktop tests
        run: npm run test:desktop

      - name: Typecheck
        run: npm run typecheck

      - name: omp extension tests
        shell: bash
        run: |
          set -eu
          if [ "$RUNNER_OS" = "Windows" ]; then
            writer="${GITHUB_WORKSPACE}/target/debug/aam.exe"
          else
            writer="${GITHUB_WORKSPACE}/target/debug/aam"
          fi
          if [ ! -f "$writer" ]; then
            echo "omp observer writer was not built: $writer"
            exit 1
          fi
          # The writer child is Windows-only. macOS still runs the node tests.
          AAM_OBSERVER_TEST_WRITER="$writer" node --test \
            integrations/omp/aam-accounts.test.mjs \
            integrations/omp/aam-observer.test.mjs

      - name: Build complete unsigned verification installers
        run: node scripts/build.mjs --verify-build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-only-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
