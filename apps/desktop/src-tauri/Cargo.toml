[package]
name = "ai-account-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aam-protocol = { path = "../../../crates/protocol" }
aam-launcher = { path = "../../../crates/launcher" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
libc.workspace = true
rfd = "0.15"
tauri-plugin-notification = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
memchr = "2"
parking_lot = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"

# 앱 ID 기준이라 경로가 다른 Ojak.app(백업 사본 등)이 이미 떠 있어도 두 번째 실행을 막고 기존 창을 연다.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Globalization", "Win32_System_Threading"] }
