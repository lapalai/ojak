[package]
name = "ai-account-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aam-protocol = { path = "../../../crates/protocol" }
aam-launcher = { path = "../../../crates/launcher" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
libc.workspace = true
rfd = "0.15"
tauri-plugin-notification = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
memchr = "2"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.59", features = ["Win32_Globalization", "Win32_System_Threading"] }
